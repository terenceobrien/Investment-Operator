seed_research_priorities:
- theme: Quality ex-AI cash-flow compounders with soft-landing and sticky-cycle resilience
  rationale: 'Quality ex-AI ranks highly because it performs well across Sticky Late Cycle AI, Late Cycle
    Risk-Off, Reopening / Soft Landing. Downstream research should test whether specific names are genuinely
    under-owned, attractively valued, and supported by revisions. Current regime: Supply-shock inflation
    / late-cycle tightening. Key drivers: Oil supply shock, AI earnings resilience.'
  edge_hypothesis: Macro support may favor high-ROIC cash-generative businesses outside explicit AI leadership,
    but the actionable edge depends on downstream proof of under-ownership, valuation support, and durable
    estimate revisions.
  sub_questions:
  - Which non-AI cash-flow compounders have positive estimate revision potential?
  - Where are balance-sheet quality and free-cash-flow durability mispriced versus AI-led scarcity names?
  - Which candidates still work if policy stays restrictive and broad beta remains uneven?
  - Which names have hidden cyclicality that would fail in a late-cycle risk-off scenario?
  priority_rank: 1
  expected_edge_decay: quarters
- theme: Cash and short duration candidates with explicit scenario asymmetry tests
  rationale: 'Cash and short duration has a positive macro support score with support from Late Cycle
    Risk-Off, Sticky Late Cycle AI, Oil Inflation Tail. Research should focus on instruments that keep
    downside manageable in Reopening / Soft Landing, then test crowding, valuation, narrative maturity,
    and bottom-up quality downstream. Current regime: Supply-shock inflation / late-cycle tightening.
    Key drivers: Oil supply shock, AI earnings resilience.'
  edge_hypothesis: The market may be underpricing cash and short duration exposures that benefit from
    the current scenario mix while retaining acceptable downside in the least favorable macro paths.
  sub_questions:
  - Which instruments provide the cleanest exposure to Cash and short duration?
  - Where do valuation and positioning leave room for upside rather than only macro beta?
  - What breaks the thesis in Reopening / Soft Landing?
  priority_rank: 2
  expected_edge_decay: quarters
- theme: Second-order grid and power infrastructure beneficiaries with cross-scenario support
  rationale: 'Grid/power ranks highly because it has positive macro support across Sticky Late Cycle AI,
    Reopening / Soft Landing, Oil Inflation Tail. Research should now test whether the best expressions
    are obvious AI-grid leaders or less-obvious second-order beneficiaries. Crowding, valuation, and narrative
    maturity should be evaluated downstream. Worst scenarios to underwrite: Late Cycle Risk-Off, AI Capex
    Rollover. Current regime: Supply-shock inflation / late-cycle tightening. Key drivers: Oil supply
    shock, AI earnings resilience.'
  edge_hypothesis: Macro support for grid and power infrastructure may create attractive research paths,
    but the edge depends on finding specific suppliers, service providers, or infrastructure names where
    ownership, valuation, revisions, and narrative maturity still leave room for upside.
  sub_questions:
  - Which names have direct but under-discussed data-center, grid, or power exposure?
  - Which names have positive estimate revision potential without extreme AI-infrastructure crowding?
  - Which names remain resilient if AI capex continues but rates stay restrictive?
  - Which names would fail if AI capex rollover probability rises?
  priority_rank: 3
  expected_edge_decay: quarters
