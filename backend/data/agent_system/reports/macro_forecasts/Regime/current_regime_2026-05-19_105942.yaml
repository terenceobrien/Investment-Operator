regime_id: supply_shock_inflation
regime_label: Sticky Late Cycle AI leads; top macro-supported themes are Quality ex-AI cash flow, Cash
  and short duration, Grid and power infrastructure.
regime_call_confidence: 0.7805
headline: Forecast favors sticky late-cycle AI leadership over broad soft-landing participation.
summary: 'The model assigns the highest probability to Sticky Late Cycle AI at 26.5%; runner-up reopening_soft_landing
  at 26.2%. The largest displayed deterministic driver is AI earnings resilience (+0.507). Healthy credit
  can keep the regime from becoming fully risk-off, while weak breadth, restrictive Fed pricing, and resilient
  AI earnings determine whether leadership stays narrow. Reported scenario probabilities are historically
  calibrated after the deterministic update. Dominant scenario: Sticky Late Cycle AI (27%); runner-up
  scenario: Reopening / Soft Landing (26%). Probability mode: historically_calibrated. Key macro tension:
  Fed path remains restrictive despite some monetary-layer improvement.'
risk_summary: 'Fed path remains restrictive despite some monetary-layer improvement. Oil risk remains
  two-sided between inflation pressure and reopening relief. Sticky Late Cycle AI could fade if Breadth
  broadens materially with equal-weight and small-cap leadership. Reopening / Soft Landing could fade
  if Breadth narrows further. Tail probabilities remain visible: risk-off 24%, AI capex rollover 8%.'
