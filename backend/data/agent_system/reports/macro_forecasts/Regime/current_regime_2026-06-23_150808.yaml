seed_research_priorities:
- theme: Quality ex-AI cash-flow compounders with soft-landing and sticky-cycle resilience
  rationale: 'Quality ex-AI ranks highly because it performs well across Reopening / Soft Landing, AI
    Capex Rollover, Sticky Late Cycle AI. Downstream research should test whether specific names are genuinely
    under-owned, attractively valued, and supported by revisions. Current regime: Sticky Late Cycle AI
    leads; top macro-supported themes are Grid and power infrastructure, Quality ex-AI cash flow, Cash
    and short duration.. Key drivers: AI earnings resilience, Breadth / participation, Credit conditions.'
  edge_hypothesis: Macro support may favor high-ROIC cash-generative businesses outside explicit AI leadership,
    but the actionable edge depends on downstream proof of under-ownership, valuation support, and durable
    estimate revisions.
  sub_questions:
  - Which non-AI cash-flow compounders have positive estimate revision potential?
  - Where are balance-sheet quality and free-cash-flow durability mispriced versus AI-led scarcity names?
  - Which candidates still work if policy stays restrictive and broad beta remains uneven?
  - Which names have hidden cyclicality that would fail in a late-cycle risk-off scenario?
  priority_rank: 1
  expected_edge_decay: quarters
- theme: Second-order grid and power infrastructure beneficiaries with cross-scenario support
  rationale: 'Grid/power ranks highly because it has positive macro support across Reopening / Soft Landing,
    Sticky Late Cycle AI, Oil Inflation Tail. Research should now test whether the best expressions are
    obvious AI-grid leaders or less-obvious second-order beneficiaries. Crowding, valuation, and narrative
    maturity should be evaluated downstream. Worst scenarios to underwrite: AI Capex Rollover, Late Cycle
    Risk-Off. Current regime: Sticky Late Cycle AI leads; top macro-supported themes are Grid and power
    infrastructure, Quality ex-AI cash flow, Cash and short duration.. Key drivers: AI earnings resilience,
    Breadth / participation, Credit conditions.'
  edge_hypothesis: Macro support for grid and power infrastructure may create attractive research paths,
    but the edge depends on finding specific suppliers, service providers, or infrastructure names where
    ownership, valuation, revisions, and narrative maturity still leave room for upside.
  sub_questions:
  - Which names have direct but under-discussed data-center, grid, or power exposure?
  - Which names have positive estimate revision potential without extreme AI-infrastructure crowding?
  - Which names remain resilient if AI capex continues but rates stay restrictive?
  - Which names would fail if AI capex rollover probability rises?
  priority_rank: 2
  expected_edge_decay: quarters
- theme: Healthcare defensives candidates with explicit scenario asymmetry tests
  rationale: 'Healthcare defensives has a positive macro support score with support from Late Cycle Risk-Off,
    AI Capex Rollover, Sticky Late Cycle AI. Research should focus on instruments that keep downside manageable
    in no single dominant scenario, then test crowding, valuation, narrative maturity, and bottom-up quality
    downstream. Current regime: Sticky Late Cycle AI leads; top macro-supported themes are Grid and power
    infrastructure, Quality ex-AI cash flow, Cash and short duration.. Key drivers: AI earnings resilience,
    Breadth / participation, Credit conditions.'
  edge_hypothesis: The market may be underpricing healthcare defensives exposures that benefit from the
    current scenario mix while retaining acceptable downside in the least favorable macro paths.
  sub_questions:
  - Which instruments provide the cleanest exposure to Healthcare defensives?
  - Where do valuation and positioning leave room for upside rather than only macro beta?
  - What breaks the thesis in no single dominant scenario?
  priority_rank: 3
  expected_edge_decay: quarters
