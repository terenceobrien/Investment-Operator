regime_id: two_sided_oil_shock_late_cycle_ai
regime_label: Sticky Late Cycle AI leads; top macro-supported themes are Grid and power infrastructure,
  Quality ex-AI cash flow, Cash and short duration.
regime_call_confidence: 0.7965
headline: Forecast favors sticky late-cycle AI leadership over broad soft-landing participation.
summary: 'The model assigns the highest probability to Sticky Late Cycle AI at 36.2%; runner-up reopening_soft_landing
  at 31.1%. The largest displayed deterministic driver is AI earnings resilience (+0.403). Healthy credit
  can keep the regime from becoming fully risk-off, while weak breadth, restrictive Fed pricing, and resilient
  AI earnings determine whether leadership stays narrow. Reported scenario probabilities are historically
  calibrated after the deterministic update. Dominant scenario: Sticky Late Cycle AI (36%); runner-up
  scenario: Reopening / Soft Landing (31%). Probability mode: historically_calibrated. Key macro tension:
  Credit is healthy but breadth is weak or narrow.'
risk_summary: 'Credit is healthy but breadth is weak or narrow. Fed path remains restrictive despite some
  monetary-layer improvement. Sticky Late Cycle AI could fade if Breadth broadens materially with equal-weight
  and small-cap leadership. Reopening / Soft Landing could fade if Breadth narrows further. Tail probabilities
  remain visible: risk-off 13%, AI capex rollover 4%.'
key_drivers:
- name: AI earnings resilience
  status: bullish/stable
  explanation: bullish for quality ai infrastructure capital spending tied to data-center demand remains
    durable, and revision-supported ai infrastructure leaders can continue working even if the broader
    macro backdrop is fragile.
- name: Breadth / participation
  status: bearish/deteriorating
  explanation: Equal weight (RSP) lagging cap weight (SPY) — mega-cap concentration, breadth narrowing
    Breadth remains weak on an absolute basis.
- name: Credit conditions
  status: bullish/stable
  explanation: HY spreads tight (275bps) — credit healthy
- name: Fed path / monetary policy
  status: mixed/mixed
  explanation: Composite reconciles layer score 5.59, layer signal mixed with Fed hold/hike probability
    80%, cut probability 20%, Fed signal bearish. Component signals are displayed but excluded from probability
    updates. High hold/hike odds keep policy from being treated as outright bullish.
- name: Oil shock and reopening optionality
  status: mixed/mixed
  explanation: still inflationary, but risk premium is now two-sided oil remains elevated versus pre-shock
    levels, but reopening and de-escalation headlines have reduced the one-way upside pressure. energy
    remains a useful hedge, but the trade is more tactical and headline-sensitive.
- name: Volatility / hedging
  status: bullish/stable
  explanation: Put/call ratio elevated (1.15) — fear-driven hedging, contrarian bullish
portfolio_implications:
- Favor themes with positive macro support across the highest-probability scenarios.
- Maintain hedges or cash-like exposure while risk-off analogue probability remains elevated.
- Distinguish quality AI and grid beneficiaries from high-beta crowded semiconductor beta.
- Best supported exposures include Grid and power infrastructure, Quality ex-AI cash flow, Cash and short
  duration, Quality AI leaders.
- Be cautious with Small caps, Long-duration growth, High-beta AI semiconductors, High beta growth.
- Treat oil and energy exposure as tactical because oil-shock risk remains two-sided.
