headline: Late-cycle expansion (narrow, capex-led, sticky inflation) leads the operator read; Expansion
  with disinflation (broadening / soft landing) is secondary.
summary: 'Late-cycle expansion with narrow, capex-led leadership and sticky-but-easing inflation. A two-sided
  oil risk sits on top: de-escalation broadens toward expansion_disinflation, re-escalation pushes toward
  inflation_shock. Credit is healthy, so the recessionary tails (growth_scare_no_credit, credit_led_recession)
  are watch-only, gated on a spread blowout that has not begun.'
risk_summary: 'Tail watch: inflation_shock, credit_led_recession. credit_led_recession probability is
  directionally correct and correctly ordered across anchors (elevated at pre-crisis configurations vs
  benign calm), but magnitudes are conservative. The crisis-honest regime labeling (~6% stress fraction)
  limits transition events available to the entry-probability logistic, lowering stress entry rates. Operator
  judgment should lean against the model on acute credit-stress setups the model may under-weight.'
