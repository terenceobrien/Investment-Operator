key_drivers:
- name: Primary behavioral scenario
  status: late_cycle_expansion
  explanation: Operator current-conditions read identifies late_cycle_expansion while the ensemble probability
    is 45.4%.
- name: Secondary behavioral scenario
  status: expansion_disinflation
  explanation: Operator current-conditions read identifies expansion_disinflation while the ensemble probability
    is 19.8%.
- name: Tail watch
  status: inflation_shock, credit_led_recession
  explanation: Current conditions annotate these behavioral scenarios as live tails to monitor.
- name: Toward Expansion Disinflation
  status: transition catalyst
  explanation: '{"confirm": ["Hormuz reopening framework announced and tanker traffic normalizes", "Oil
    holds below $90 for five+ sessions and inflation breakevens roll over", "CPI/PCE show disinflation
    after the April uptick", "Fed guidance shifts from hold/hike optionality toward explicit cut optionality",
    "Market breadth improves; small caps and equal-weight outperform"], "from": "late_cycle_expansion",
    "invalidate": ["Oil rebounds above recent shock highs on renewed disruption", "Fed hike odds rise
    after hot inflation data", "Credit spreads widen despite lower oil"]}'
- name: Toward Inflation Shock
  status: transition catalyst
  explanation: '{"confirm": ["Renewed Hormuz disruption or attacks on shipping infrastructure", "Oil breaks
    higher and stays elevated through multiple inflation releases", "Inflation breakevens rise for two+
    weeks", "Fed hike odds increase and officials push back against cuts", "Consumer discretionary earnings
    weaken on fuel/input costs"], "from": "late_cycle_expansion", "invalidate": ["Verified tanker normalization
    and sustained oil decline below $90", "Inflation prints soften despite higher energy prices", "Fed
    hike odds fade meaningfully"]}'
- name: Toward Growth Scare Or Credit Recession
  status: transition catalyst
  explanation: '{"confirm": ["Payrolls, claims, retail sales, or PMIs deteriorate abruptly", "HY spreads
    widen materially from tight starting levels (-> credit_led_recession specifically)", "Bank lending
    or funding-stress indicators worsen (-> credit_led_recession specifically)", "AI leaders sell off
    despite stable rates, showing leadership exhaustion"], "from": "late_cycle_expansion", "invalidate":
    ["Credit spreads remain tight while breadth improves", "Labor data stabilize and consumption remains
    resilient", "Fed pre-emptively eases with credible disinflation cover"], "note": "Which of the two
    recessionary scenarios depends on CREDIT: spreads holding = growth_scare_no_credit; spreads blowing
    out = credit_led_recession. The HY spread is the deciding variable."}'
portfolio_implications:
- 'Late-cycle expansion (narrow, capex-led, sticky inflation): Cap-weighted holds up better than equal-weight;
  quality AI, grid, defense, infrastructure lead; small caps lag.'
- 'Expansion with disinflation (broadening / soft landing): Broad equities rise with improving breadth;
  small caps and rate-sensitive quality catch up.'
- 'Credit-led recession (spread blowout + contraction): Broad severe drawdown; high-beta, small caps,
  weak balance sheets worst; quality/low-leverage least bad.'
- The current_regime_read and tail_watch here inform the OPERATOR PRIOR overlay on the ensemble output.
  Where the operator sees a tail the quarterly ensemble structurally under-weights (e.g. an acute credit
  setup building faster than macro data confirms), this file is where that judgment is recorded and applied
  as a Bayesian tilt on the ensemble probabilities.
