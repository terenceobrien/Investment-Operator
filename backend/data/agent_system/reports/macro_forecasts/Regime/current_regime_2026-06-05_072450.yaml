summary: 'The model assigns the highest probability to Reopening / Soft Landing at 36.2%; runner-up sticky_late_cycle_ai
  at 34.1%. The largest displayed deterministic driver is Breadth and participation (-0.297). Healthy
  credit can keep the regime from becoming fully risk-off, while weak breadth, restrictive Fed pricing,
  and resilient AI earnings determine whether leadership stays narrow. Reported scenario probabilities
  are historically calibrated after the deterministic update. Dominant scenario: Reopening / Soft Landing
  (36%); runner-up scenario: Sticky Late Cycle AI (34%). Probability mode: historically_calibrated. Key
  macro tension: Credit is healthy but breadth is weak or narrow.'
risk_summary: 'Credit is healthy but breadth is weak or narrow. Fed path remains restrictive despite some
  monetary-layer improvement. Reopening / Soft Landing could fade if Breadth narrows further. Sticky Late
  Cycle AI could fade if Breadth broadens materially with equal-weight and small-cap leadership. Tail
  probabilities remain visible: risk-off 12%, AI capex rollover 7%.'
