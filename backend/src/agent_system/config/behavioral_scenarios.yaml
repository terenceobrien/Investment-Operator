schema_version: '2.0'
taxonomy: behavioral
generated_at: '2026-07-27'
horizon_days: 63
notes: 'Single source of truth for the six behavioral scenarios. Replaces the narrative current_scenarios.yaml.
  NO probability field: scenario probabilities are an OUTPUT of the BVAR ensemble (path-share counts),
  not an input. Catalysts/falsifiers live in a separate current-conditions annotation layer, not here.
  Return assumptions are the empirically-calibrated behavioral basket (basket_calibration_v1); narrative
  returns were used only as cross-check and are superseded where they conflicted.'
reconciliation_notes:
- late_cycle_risk_off (narrative, -10% SPY) bundled a growth scare AND a credit crack; it splits across
  growth_scare_no_credit and credit_led_recession. Its bearish magnitude belongs to the credit leg.
- 'ai_capex_rollover (narrative, -5% SPY) is a SECTOR-ROTATION story with no distinct macro signature;
  it maps loosely to growth_scare_no_credit for its equity-derate/credit-orderly shape, but is better
  understood as a tilt WITHIN a benign regime. Flagged for adjudication: it may warrant an annotation-layer
  tilt rather than a scenario.'
- Where narrative and behavioral returns conflicted, behavioral (analogue-calibrated) returns win.
