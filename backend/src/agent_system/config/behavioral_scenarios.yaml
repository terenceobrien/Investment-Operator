      credit: widens selectively
      policy: forced hawkish / hikes back on table
    definition: A supply-side inflation impulse (e.g. energy) reignites inflation; the Fed cannot ease
      and may reprice toward hikes. Growth damage is a consequence of the policy response, not an assumption.
