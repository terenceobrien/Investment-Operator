    label: Stagflation (weak growth + persistent inflation)
    macro_configuration:
      growth: stagnant / near zero
      inflation: persistently elevated
      credit: widening
      policy: policy bind (pulled both ways)
    definition: Weak growth and sticky inflation simultaneously; the Taylor rule is pulled in both directions.
      Defined as a specific stagnant-output outcome rather than a tilt vs baseline.
    classifier_signature_ref: frbus_handoff::stagflation
    frbus_template: demand_with_inflation_addfactor
    factor_implications:
