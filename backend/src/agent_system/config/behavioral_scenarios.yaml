  credit_led_recession:
    label: Credit-led recession (spread blowout + contraction)
    macro_configuration:
      growth: contracting
      inflation: falling
      credit: spreads blow out (funding stress)
      policy: aggressive easing, behind the curve
    definition: Credit deteriorates first; spreads blow out, financial conditions tighten through both
      corporate borrowing costs and the equity premium, and the real economy follows. Deeper and slower-recovering
      than growth_scare_no_credit; the spread blowout is the distinguishing lever.
    classifier_signature_ref: frbus_handoff::credit_led_recession
    frbus_template: credit_spread_shock
    factor_implications:
      rates: Front end collapses as cuts are priced; curve bull-steepens hard; flight to quality.
      equities: Broad severe drawdown; high-beta, small caps, weak balance sheets worst; quality/low-leverage
        least bad.
      credit: HY spreads widen sharply, IG widens materially; lower-quality issuers underperform badly.
      dollar: Rallies on global risk aversion and funding demand.
