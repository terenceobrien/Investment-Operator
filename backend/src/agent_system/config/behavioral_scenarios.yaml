    macro_configuration:
      growth: above-trend / firm
      inflation: falling toward target
      credit: tight/healthy spreads
      policy: easing bias
    definition: Demand holds above the baseline while core inflation surprises to the downside; the Taylor
      rule turns easier and financial conditions loosen, broadening risk participation beyond narrow leadership.
    classifier_signature_ref: frbus_handoff::expansion_disinflation
    frbus_template: demand_with_inflation_addfactor
    factor_implications:
      rates: Front end rallies as cut odds build; 10y drifts lower.
      equities: Broad equities rise with improving breadth; small caps and rate-sensitive quality catch
        up.
      credit: IG/HY spreads stay tight or grind tighter as inflation risk fades without recession signal.
      dollar: Softens modestly as cut odds rise and global risk appetite improves.
      commodities: Oil contained; industrial metals firmer if growth holds.
