regime_id: two_sided_oil_shock_broadening_watch
regime_label: Reopening / Soft Landing narrowly leads a contested tape; sticky AI leadership remains a
  near-equal runner-up. Top macro-supported themes are Grid and power infrastructure, Quality ex-AI cash
  flow, Cash and short duration.
regime_call_confidence: 0.36
regime_call_confidence_note: Low. Top two scenarios are separated by ~2 points (36.2% vs 34.1%) after
  historical calibration; tail scenarios are held up by probability floors. Treat the dominant scenario
  as provisional, not settled.
headline: Forecast narrowly favors broadening soft-landing participation over sticky late-cycle AI leadership,
  but the two are effectively a coin-flip.
summary: 'The model assigns the highest probability to Reopening / Soft Landing at 36.2%; runner-up sticky_late_cycle_ai
  at 34.1%. The gap is only ~2 points, so leadership direction is genuinely contested rather than resolved.
  The largest displayed deterministic driver is weak equal-weight-vs-cap-weight breadth (-0.30), which
  cuts against broadening, while resilient AI earnings (+0.52 into sticky AI) and healthy credit keep
  narrow leadership viable. Reported scenario probabilities are historically calibrated after the deterministic
  update; note that calibration narrowed a large deterministic soft-landing lead (47%) down to a near-tie,
  so the blended call rests heavily on the analogue layer. Dominant scenario: Reopening / Soft Landing
  (36%); runner-up scenario: Sticky Late Cycle AI (34%). Probability mode: historically_calibrated. Key
  macro tension: breadth signals conflict - cap-weight concentration says narrow, but advance-decline,
  percent-above-200D, and small-cap leadership say participation is improving.'
risk_summary: 'Credit is healthy and volatility is orderly, which keeps the regime from becoming fully
  risk-off. The decisive question is breadth: equal-weight still lags cap-weight, but ADL slope, percent-above-200D,
  and IWM-over-SPY leadership are improving - a broadening confirmation would tip the balance toward soft
  landing, while renewed narrowing would restore sticky AI. Fed path remains restrictive (hold/hike ~80%,
  though that read is dated 05/19 and should be refreshed). Historical analogues disagree with the deterministic
  engine on downside: analogues map materially more weight to Late Cycle Risk-Off than the rule-based
  layer does, so the risk-off tail is likely understated by the blended 12%. Tail probabilities remain
  visible: risk-off 12%, oil inflation tail 10%, AI capex rollover 7% (floored).'
key_drivers:
- name: Breadth / participation
  status: mixed/improving
  explanation: Genuinely conflicting. Equal weight (RSP) still lags cap weight (SPY) over 3M (RSP +11.9%
    vs SPY +14.8%; rsp_vs_spy_z -0.70), which supports narrow leadership. But percent-above-200D is 81.8
    and improving, ADL slope is +0.62 and improving, and small caps are leading (IWM minus SPY +5.8pp
    over 3M). Broadening is not yet confirmed by equal-weight, but the internals are no longer uniformly
    weak. This split is the swing factor between the top two scenarios.
- name: AI earnings resilience
  status: bullish/stable
  explanation: Data-center-tied capital spending remains durable and revision-supported AI infrastructure
    leaders can keep working even if the broader backdrop is fragile. This is the main force keeping sticky
    late-cycle AI a near-equal runner-up.
- name: Credit conditions
  status: bullish/stable
  explanation: HY OAS tight at 276bps (z -0.77, 4W change -6bps), IG at 74bps. Healthy credit reduces
    near-term risk-off odds and is a prerequisite for any broadening.
- name: Fed path / monetary policy
  status: mixed/restrictive
  explanation: Monetary layer score 5.59, mixed/improving, but the composite reconciles it against Fed
    hold/hike pricing of ~80% (cut ~20%), which keeps policy from being treated as outright bullish. Caveat
    - the FedWatch read is dated 2026-05-19, roughly two weeks stale versus the 06-05 as-of date, and
    should be refreshed before the cycle.
- name: Oil shock and reopening optionality
  status: mixed/mixed
  explanation: Still inflationary but now two-sided. Oil remains elevated versus pre-shock levels, but
    reopening and de-escalation headlines have reduced one-way upside pressure (USO -17.3% over 3M). Energy
    remains a useful hedge, but the trade is tactical and headline-sensitive.
- name: Volatility / hedging
  status: mixed/stable
  explanation: VIX 21.5 with an elevated 20-day z-score (+3.07) and elevated SKEW (152), pointing to some
    tail hedging, but term structure is mildly upward (slope +0.31) and VVIX is unremarkable (102). Structure
    is orderly rather than stressed. Note - the equity put/call input was unresolved this run and is intentionally
    omitted rather than asserted.
portfolio_implications:
- Favor themes with positive macro support across the two near-equal lead scenarios, since leadership
  direction is unresolved - prioritize exposures that work in both broadening and sticky-AI outcomes.
- Grid and power infrastructure and Quality ex-AI cash flow rank highest precisely because they carry
  positive support across both leads; weight them over single-scenario bets.
- Maintain hedges or cash-like exposure while the risk-off analogue signal remains elevated relative to
  the deterministic read.
- Distinguish quality AI and grid beneficiaries from high-beta crowded semiconductor beta.
- 'Treat the broadening call as provisional: a confirmed equal-weight / small-cap breakout strengthens
  it, renewed narrowing reverses it.'
- Treat oil and energy exposure as tactical because oil-shock risk remains two-sided.
- Small caps remain macro-unsupported on the theme score despite improving breadth internals; this tension
  is deliberate and should be tested downstream rather than assumed resolved.
